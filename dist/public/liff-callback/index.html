<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE 로그인 - Fonday</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #f5f5f5; color: #333; }
    .wrap { text-align: center; }
    .logo { font-size: 24px; font-weight: 900; color: #4A7C6E; margin-bottom: 12px; }
    .msg { font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Fonday</div>
    <div class="msg">LINE 로그인 중...</div>
  </div>
  <script>
    liff.init({ liffId: "2009518965-G9uSn0zN" })
      .then(function () {
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return null;
        }
        var accessToken = liff.getAccessToken();
        return fetch("/api/liff-auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken: accessToken }),
        });
      })
      .then(function (res) {
        if (res && res.ok) {
          window.location.replace("/?login=success");
        } else if (res) {
          window.location.replace("/");
        }
      })
      .catch(function (err) {
        console.error("LIFF error:", err);
        window.location.replace("/");
      });
  </script>
</body>
</html>
