name = "fonday-push-worker"
main = "worker-api.js"
compatibility_date = "2024-01-01"

# ── Cron Triggers (Free plan 5개 제한) ────────────────────────────
# UTC 0,22 = KST 09:00 화장품 효과 리마인더 + KST 07:00 스캔/날씨
# UTC 01 = KST 10:00 → UV 케어
# UTC 03 = KST 12:00 → 점심 식단
# UTC 06,09 = KST 15,18시 → 수분 리마인더 + 저녁 식단
# UTC 11-14 = KST 20-23시 → 루틴 리마인더(11/12/13) + 취침 케어(14)
[triggers]
crons = ["0 0,22 * * *", "0 1 * * *", "0 3 * * *", "0 6,9 * * *", "0 11-14 * * *"]

# ── KV Namespaces ─────────────────────────────────────────────────
# PUSH_KV: Cloudflare 대시보드에서 KV 네임스페이스 생성 후 아래 id를 교체하세요.
# 생성 명령: wrangler kv:namespace create PUSH_KV
[[kv_namespaces]]
binding = "PUSH_KV"
id = "9ef421f3bbbc4ba7a97f3a7cfb73fc8e"

# ── D1 Databases ──────────────────────────────────────────────────
[[d1_databases]]
binding = "FONDAY_DB"
database_name = "fonday-db"
database_id = "125366b1-198e-4cef-a3d7-167befda2c77"

# ── Secrets (wrangler secret put 명령으로 등록) ───────────────────
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_PRIVATE_KEY
# wrangler secret put VAPID_SUBJECT   → "mailto:nexiope@gmail.com"
# wrangler secret put GEMINI_API_KEY
