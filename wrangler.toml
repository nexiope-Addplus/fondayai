name = "fonday-push-worker"
main = "worker-api.js"
compatibility_date = "2024-01-01"

# ── Cron Triggers ─────────────────────────────────────────────────
# KST 12:00 = UTC 03:00 (점심)
# KST 18:00 = UTC 09:00 (저녁)
[triggers]
crons = ["0 3 * * *", "0 9 * * *"]

# ── KV Namespaces ─────────────────────────────────────────────────
# PUSH_KV: Cloudflare 대시보드에서 KV 네임스페이스 생성 후 아래 id를 교체하세요.
# 생성 명령: wrangler kv:namespace create PUSH_KV
[[kv_namespaces]]
binding = "PUSH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ── Secrets (wrangler secret put 명령으로 등록) ───────────────────
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_PRIVATE_KEY
# wrangler secret put VAPID_SUBJECT   → "mailto:nexiope@gmail.com"
# wrangler secret put GEMINI_API_KEY
